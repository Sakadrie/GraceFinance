<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (compteComptable(); as compteComptableRef) {
      <div>
        <h2 data-cy="compteComptableDetailsHeading">
          <span jhiTranslate="graceFinanceApp.compteComptable.detail.title">Compte Comptable</span>
        </h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ compteComptableRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="graceFinanceApp.compteComptable.code">Code</span></dt>
          <dd>
            <span>{{ compteComptableRef.code }}</span>
          </dd>
          <dt><span jhiTranslate="graceFinanceApp.compteComptable.libelle">Libelle</span></dt>
          <dd>
            <span>{{ compteComptableRef.libelle }}</span>
          </dd>
          <dt><span jhiTranslate="graceFinanceApp.compteComptable.classe">Classe</span></dt>
          <dd>
            <span>{{ compteComptableRef.classe }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/compte-comptable', compteComptableRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
