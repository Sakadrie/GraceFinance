<!doctype html>
<html class="no-js" lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>graceFinance</title>
    <meta name="description" content="Description for graceFinance" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <base href="/" />
    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webapp" />

    <!-- WebFont chargé ICI avant l'appel WebFont.load() -->
    <script src="content/public/assets/js/plugin/webfont/webfont.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ['Public Sans:300,400,500,600,700'] },
        custom: {
          families: ['Font Awesome 5 Solid', 'Font Awesome 5 Regular', 'Font Awesome 5 Brands', 'simple-line-icons'],
          urls: ['content/public/assets/css/fonts.min.css'],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>
  </head>

  <body>
    <jhi-app></jhi-app>

    <script>
      $('#lineChart').sparkline([102, 109, 120, 99, 110, 80, 87, 74, 102, 109, 120, 99, 110, 80, 87, 74], {
        type: 'line',
        height: '100',
        width: '250',
        lineWidth: '2',
        lineColor: '#177dff',
        fillColor: 'rgba(23, 125, 255, 0.2)',
      });

      $('#barChart').sparkline([102, 109, 120, 99, 110, 80, 87, 74, 102, 109, 120, 99, 110, 80, 87, 74], {
        type: 'bar',
        height: '100',
        barWidth: 9,
        barSpacing: 10,
        barColor: '#177dff',
      });

      $('#sparktristateChart').sparkline([1, 1, 0, 1, -1, -1, 1, -1, 0, 0, 1, 1], {
        type: 'tristate',
        posBarColor: '#35cd3a',
        negBarColor: '#f3545d',
        height: '100',
        barWidth: 9,
        barSpacing: 10,
      });

      $('#discreteChart').sparkline([4, 6, 7, 7, 4, 3, 2, 1, 4, 4, 5, 6, 7, 6, 6, 2, 4, 5], {
        type: 'discrete',
        lineColor: '#177dff',
        thresholdColor: '#f3545d',
        thresholdValue: 4,
        height: '100',
        width: '150',
      });

      $('#pieChart').sparkline([20, 50, 30], {
        type: 'pie',
        height: '100',
      });
    </script>
  </body>
</html>
